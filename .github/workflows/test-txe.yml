name: PXE Tests for Aztec OTC Desk

on:
    push:
      branches:
        - main
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
    setup-and-run:
      strategy:
        matrix:
          os: [ubuntu-latest]
          threads: [12]

      runs-on: ${{ matrix.os }}
      timeout-minutes: 60

      concurrency:
        group: job-${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.threads }}
        cancel-in-progress: false

      steps:
        - name: Common Aztec Setup
          uses: ./.github/actions/aztec-setup
        
        - name: Start sandbox
          run: |
            cd packages/contracts && bun run sandbox &

        - name: Install project dependencies
          run: bun install
  
        - name: Compile
          run: cd packages/contracts && bun run build

        - name: Run pxe tests
          run: cd packages/contracts && bun test