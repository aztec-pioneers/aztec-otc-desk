name: PXE Tests for Aztec OTC Desk

on:
    push:
      branches:
        - main
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
    setup-and-run:
      strategy:
        matrix:
          os: [ubuntu-latest]
          threads: [12]

      runs-on: ${{ matrix.os }}
      timeout-minutes: 60

      concurrency:
        group: job-${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.threads }}
        cancel-in-progress: false

      steps:
        - name: Checkout repository
          uses: actions/checkout@v3
          with:
            fetch-depth: 0 # Fetch all history for comparison
  
        - uses: actions/setup-node@v4
          with:
            node-version: "22.20.0"

        - name: Install Bun
          run: curl -fsSL https://bun.sh/install | bash

        - name: Update path for Bun
          run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
  
        - name: Set up Docker
          uses: docker/setup-buildx-action@v2
  
        - name: Detect Aztec version
          id: aztec-version
          run: |
            AZTEC_VERSION=$(node -p "require('./package.json').config.aztecVersion")
            echo "version=$AZTEC_VERSION" >> "$GITHUB_OUTPUT"
            echo "Aztec version is ${{ steps.aztec-version.outputs.version }}"

        - name: Install Aztec CLI
          run: |
            curl -s https://install.aztec.network > tmp.sh
            bash tmp.sh <<< yes "yes"
  
        - name: Update path
          run: echo "/home/runner/.aztec/bin" >> $GITHUB_PATH
  
        - name: Set Aztec version
          run: |
            VERSION=${{ steps.aztec-version.outputs.version }} aztec-up
        
        - name: Start sandbox
          run: |
            cd packages/contracts && bun run sandbox &

        - name: Install project dependencies
          run: bun install
  
        - name: Compile
          run: cd packages/contracts && bun run build

        - name: Run js tests
          run: cd packages/contracts && bun test