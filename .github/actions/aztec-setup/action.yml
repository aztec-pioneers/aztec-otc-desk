name: 'Common Aztec OTC Desk Setup'
description: 'Sets up Bun, Aztec, compiles, and optionally runs Sandbox & 2 PXEs'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.20.0'
  start-local-net:
    description: 'Whether to start the Aztec Sandbox'
    required: false
    default: 'false'
  start-api:
    description: 'Whether to start the Orderflow API'
    required: false
    default: 'false'

outputs:
  aztec-version:
    description: 'Detected Aztec version'
    value: ${{ steps.aztec-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Bun
      run: curl -fsSL https://bun.sh/install | bash
      shell: bash

    - name: Update path for Bun
      run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
      shell: bash

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Detect Aztec version
      id: aztec-version
      run: |
        AZTEC_VERSION=$(node -p "require('./package.json').config.aztecVersion")
        echo "version=$AZTEC_VERSION" >> "$GITHUB_OUTPUT"
        echo "Aztec version is $AZTEC_VERSION"
      shell: bash

    - name: Install Foundry
      run: |
        curl -L https://foundry.paradigm.xyz -o /tmp/foundry-install.sh
        bash /tmp/foundry-install.sh
        echo "$HOME/.foundry/bin" >> $GITHUB_PATH
        $HOME/.foundry/bin/foundryup
      shell: bash

    - name: Install Aztec CLI
      run: |
        curl -sL https://install.aztec.network | bash
      shell: bash

    - name: Update path for Aztec
      run: echo "$HOME/.aztec/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install Aztec version
      run: |
        aztec-up install ${{ steps.aztec-version.outputs.version }}
      shell: bash
    
    - name: Start Aztec local network
      if: inputs.start-local-net == 'true' && inputs.start-api == 'false'
      run: |
        bun run scripts/docker.ts local-network &
      shell: bash
    
    - name: Start Aztec local network and Orderflow API
      if: inputs.start-local-net == 'true' && inputs.start-api == 'true'
      run: |
        bun run local &
      shell: bash

    - name: Wait for Aztec node to be healthy
      if: inputs.start-local-net == 'true'
      run: |
        echo "Waiting for Aztec node to be ready..."
        timeout 120 bash -c 'until curl -f http://localhost:8080/status > /dev/null 2>&1; do sleep 2; done'
        echo "Aztec node is ready!"
      shell: bash

    - name: Install project dependencies
      run: bun install
      shell: bash
  
    - name: Compile
      run: cd packages/contracts && bun run build
      shell: bash