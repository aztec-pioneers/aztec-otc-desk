
services:
  # Aztec PXE - Private Execution Environment in Server
  aztec-pxe:
    image: aztecprotocol/aztec:latest
    ports:
      - "8081-8082:8080"  # PXE API
    environment:
      # PXE configuration
      - AZTEC_PORT=8080
      - AZTEC_NODE_URL=https://aztec-alpha-testnet-fullnode.zkv.xyz
      - ETHEREUM_HOSTS=https://eth-sepolia.public.blastapi.io
      - L1_CHAIN_ID=11155111
      - ROLLUP_VERSION=1714840162
      - LOG_LEVEL=info

      # Optional: Enable proving in PXE
      - PXE_PROVER_ENABLED=${PXE_PROVER_ENABLED:-true}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        node --no-warnings /usr/src/yarn-project/aztec/dest/bin/index.js start --pxe
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - aztec-network
    deploy:
      replicas: 2

networks:
  aztec-network:
    driver: bridge